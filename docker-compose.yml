services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=123456789
      - MYSQL_DATABASE=persona
      - TZ=America/Bogota
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - 3306:3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456789"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - clase

  ms-persona:
    image: ms-persona:2
    container_name: ms-persona
    restart: on-failure
    ports:
      - 8080:8080
    environment:
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_NAME=persona
      - DATABASE_USERNAME=root
      - DATABASE_PASSWORD=123456789
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=9201
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - clase

  ms-persona2:
    image: ms-persona:4
    container_name: ms-persona2
    restart: on-failure
    ports:
      - 8081:8080
    environment:
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_NAME=persona
      - DATABASE_USERNAME=root
      - DATABASE_PASSWORD=123456789
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=9201
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - clase

volumes:
  mysql-data:

networks:
  clase:
    external: true


